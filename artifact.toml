[artifact]
slug = "gipper"
title = "gipper — GPU jobs across cloud markets"
description = "Estimate, run, collect, and verify teardown for rented GPU jobs."
kind = "reference-guide"
form = "collection"
status = "live"
created = "2026-11-04"
updated = "2026-11-04"

# Raw HTML is owned by site/; scripts/build_site.py renders public Markdown guides.
[build]
site = "docs"
commands = ["uv run --group site python scripts/build_site.py"]

[deploy]
target = "github-pages"

[deploy.github-pages]
mode = "docs"
docs_dir = "docs"
subpath = ""
own_root = true
commit = true
push = false
