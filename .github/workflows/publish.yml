name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gipper/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          uv run python -c 'import os,tomllib; from gipper import __version__; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert v==__version__; assert os.environ["RELEASE_TAG"]=="v"+v'
      - run: uv sync --locked --extra test
      - run: uv run ruff check gipper tests scripts
      - run: uv run --extra test pytest -q
      - run: uv build
      - run: uv run --no-project scripts/check_dist.py
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
