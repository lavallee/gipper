[endpoint]
name = "gipper-serverless-smoke"
# Replace with the image built from this directory, ideally an immutable digest.
image = "YOUR_REGISTRY/gipper-cuda-smoke:0.6.0"
max_workers = 1
idle_seconds = 15
execution_seconds = 120
session_seconds = 600

[budget]
# Recheck the SERVERLESS catalog before deploying. This is an admission estimate,
# not a provider-enforced spending cap or a measured bill.
rate_usd_h = 1.34
max_usd = 0.30

[runpod]
pools = ["ADA_24"]
min_cuda_version = "12.8"
flashboot = "FLASHBOOT"
# Optional existing storage. Never combine global_volume with network_volumes.
# global_volume = "volume-id"
# network_volumes = ["regional-volume-id"]
# data_centers = ["US-IL-1"]
