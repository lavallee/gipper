[project]
name = "gipper"
version = "0.3.0"
description = "Run GPU jobs across cloud markets with cost estimates, verified teardown, and an append-only ledger"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marc Lavallee" }]
keywords = ["gpu", "runpod", "vast", "cloud", "batch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
]

requires-python = ">=3.12"
dependencies = []  # stdlib only

[project.urls]
Homepage = "https://lavallee.github.io/gipper/"
Documentation = "https://lavallee.github.io/gipper/guides/quickstart.html"
Repository = "https://github.com/lavallee/gipper"
Issues = "https://github.com/lavallee/gipper/issues"
Changelog = "https://github.com/lavallee/gipper/blob/main/CHANGELOG.md"

[project.scripts]
gipper = "gipper.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gipper*"]

[tool.setuptools.package-data]
"gipper" = ["*.sh"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]
site = ["markdown-it-py>=3,<5"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with correctness and import errors; avoid reformatting legacy clients.
select = ["E4", "E9", "F"]
